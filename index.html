      </div>
    </div>
    <label class="check"><input type="checkbox" id="gen" ${settings.gen?"checked":""}><span>Добавлять случайные задачи: подсети, маски, longest match, поля заголовков IPv4/IPv6/TCP/UDP, порты, SEQ/ACK, EUI-64, подсети IPv6, системы счисления. Они создаются заново при каждом запуске, поэтому их нельзя выучить наизусть.</span></label>
    <div class="foot">
      <span class="count">${pool.length} вопросов из банка подходят${genOn?" + задачи на расчёт":""}</span>
      <button type="button" class="btn" id="start" ${pool.length||genOn?"":"disabled"}>Начать тест</button>
    </div>
  </section>`;
  app.querySelectorAll("[data-topic]").forEach(b=>b.onclick=()=>{const k=b.dataset.topic;settings.topics=settings.topics.includes(k)?settings.topics.filter(x=>x!==k):[...settings.topics,k];saveSet();renderSetup();});
  app.querySelectorAll("[data-level]").forEach(b=>b.onclick=()=>{const l=+b.dataset.level;settings.levels=settings.levels.includes(l)?settings.levels.filter(x=>x!==l):[...settings.levels,l].sort();saveSet();renderSetup();});
  app.querySelectorAll("[data-count]").forEach(b=>b.onclick=()=>{const c=b.dataset.count;settings.count=c==="all"?"all":+c;saveSet();renderSetup();});
  app.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{settings.mode=b.dataset.mode;saveSet();renderSetup();});
  document.getElementById("all-on").onclick=()=>{settings.topics=Object.keys(TOPICS);saveSet();renderSetup();};
  document.getElementById("all-off").onclick=()=>{settings.topics=[];saveSet();renderSetup();};
  document.getElementById("gen").onchange=e=>{settings.gen=e.target.checked;saveSet();renderSetup();};
  document.getElementById("start").onclick=startQuiz;
}
function saveSet(){store.set("itn-trainer-settings",settings);}

function startQuiz(retry){
  let qs;
  if(Array.isArray(retry)){qs=shuffle(retry).map(prep);}
  else{
    const pool=shuffle(poolFor(settings));
    const gl=gensFor(settings), genOn=settings.gen&&gl.length>0;
    const want=settings.count==="all"?pool.length+(genOn?30:0):settings.count;
    let nGen=genOn?(settings.count==="all"?30:Math.max(1,Math.round(want*0.25))):0;
    if(genOn&&want>pool.length)nGen=Math.max(nGen,want-pool.length);
    const st=pool.slice(0,Math.max(0,want-nGen));
    const gl2=shuffle(gl);const gens=[];for(let i=0;i<nGen;i++)gens.push(gl2[i%gl2.length].f());
    qs=shuffle([...st,...gens]).map(prep);
  }
  if(!qs.length)return;
  S={qs,i:0,answers:[],mode:settings.mode,sel:new Set(),done:false,input:""};
  renderQ();
}

/* ---------- Экран вопроса ---------- */
function renderQ(){
  const q=S.qs[S.i], n=S.qs.length, right=S.answers.filter(a=>a.ok).length;
  const multi=q.opts&&q.nCorrect>1;
  const answered=S.done;
  const topic=TOPICS[q.t];
  app.innerHTML=`
  <section class="panel" aria-live="polite">
    <div class="progress">
      <div class="prow"><span>Вопрос ${S.i+1} из ${n}</span><span>${S.mode==="practice"?`Верно: ${right} из ${S.answers.length}`:"Режим экзамена"}</span></div>
      <div class="bar"><i style="width:${(S.i+(answered?1:0))/n*100}%"></i></div>
    </div>
    <div class="qmeta">
      <span class="tag">${esc(topic.n)}</span>
      <span class="tag">${wire(q.l,true)}${LEVELS[q.l].n}</span>
      ${q.x==="end"?`<span class="tag ex">Из end-term</span>`:""}
      ${q.gen?`<span class="tag">Случайная задача</span>`:""}
    </div>
    <p class="qtext">${esc(q.q)}</p>
    ${multi?`<div class="hint">Выберите ${q.nCorrect}</div>`:""}
    ${q.opts?`<div class="opts" role="group">${q.opts.map((o,j)=>{
      let cls="opt";
      if(answered&&S.mode==="practice"){if(o.ok)cls+=" right";else if(S.sel.has(j))cls+=" wrong";}
      else if(S.sel.has(j))cls+=" sel";
      return `<button type="button" class="${cls}" data-o="${j}" ${answered?"disabled":""} aria-pressed="${S.sel.has(j)}"><span class="k">${j+1}</span><span>${esc(o.t)}</span></button>`}).join("")}</div>`
     :`<input class="inp" id="ans" autocomplete="off" spellcheck="false" placeholder="Ответ: ${esc(q.ph||"")}" value="${esc(S.input)}" ${answered?"disabled":""}>`}
    ${answered&&S.mode==="practice"?feedback(q):""}
    <div class="actions">
      <button type="button" class="btn ghost" id="quit">Завершить тест</button>
      ${answered?`<button type="button" class="btn" id="next">${S.i+1<n?"Следующий вопрос":"Показать результат"}</button>`
               :`<button type="button" class="btn" id="submit">${S.mode==="practice"?"Проверить":"Ответить"}</button>`}
    </div>
    <div class="kbd">${q.opts?"Клавиши 1–"+q.opts.length+" выбирают вариант, ":""}Enter — ${answered?"дальше":"ответить"}</div>
  </section>`;
  app.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>toggle(+b.dataset.o));
  const inp=document.getElementById("ans");
  if(inp){inp.oninput=e=>{S.input=e.target.value;updSubmit();};if(!answered)inp.focus();}
  const sb=document.getElementById("submit");if(sb)sb.onclick=submit;
  const nx=document.getElementById("next");if(nx){nx.onclick=next;nx.focus();}
  document.getElementById("quit").onclick=()=>{if(S.answers.length)renderResults();else renderSetup();};
  updSubmit();
}
function updSubmit(){const b=document.getElementById("submit");if(!b)return;const q=S.qs[S.i];b.disabled=q.opts?S.sel.size===0:!S.input.trim();}
function toggle(j){
  if(S.done)return;const q=S.qs[S.i];
  if(q.nCorrect>1){S.sel.has(j)?S.sel.delete(j):S.sel.add(j);}else{S.sel=new Set([j]);}
  renderQ();
}
function isRight(q){
  if(q.opts){const want=new Set(q.opts.map((o,j)=>o.ok?j:-1).filter(j=>j>=0));return want.size===S.sel.size&&[...want].every(j=>S.sel.has(j));}
  if(q.check)return q.check(S.input);
  const n=s=>s.trim().toLowerCase().replace(/\s+/g," ");
  return q.a.some(a=>n(a)===n(S.input));
}
function correctText(q){return q.opts?q.opts.filter(o=>o.ok).map(o=>o.t).join("; "):(q.ans||q.a[0]);}
function yourText(q,a){return q.opts?(a.sel.length?a.sel.map(j=>q.opts[j].t).join("; "):"нет ответа"):(a.input||"нет ответа");}
function feedback(q){
  const a=S.answers[S.answers.length-1];
  return `<div class="fb ${a.ok?"ok":"bad"}"><strong>${a.ok?"Верно.":"Неверно."}</strong>
    ${a.ok?"":`<span>Правильный ответ: <span class="${q.opts?"":"ans"}">${esc(correctText(q))}</span></span>`}
    <span>${esc(q.e)}</span></div>`;
}
function submit(){
  const q=S.qs[S.i];if(q.opts?S.sel.size===0:!S.input.trim())return;
  S.answers.push({q,ok:isRight(q),sel:[...S.sel],input:S.input});
  S.done=true;
  if(S.mode==="exam")next();else renderQ();
}
function next(){
  if(S.i+1>=S.qs.length){renderResults();return;}
  S.i++;S.sel=new Set();S.input="";S.done=false;renderQ();window.scrollTo({top:0});
}
document.addEventListener("keydown",e=>{
  if(!S||!document.querySelector(".qtext"))return;
  if(e.key==="Enter"){e.preventDefault();if(S.done)next();else submit();return;}
  if(e.target.id==="ans")return;
  const n=parseInt(e.key,10);const q=S.qs[S.i];
  if(q.opts&&n>=1&&n<=q.opts.length){toggle(n-1);}
});

/* ---------- Результаты ---------- */
function pct(c,n){return n?Math.round(c/n*100):0}
function color(p){return p>=80?"var(--ok)":p>=50?"var(--l1)":"var(--bad)"}
function renderResults(){
  const A=S.answers, c=A.filter(a=>a.ok).length, p=pct(c,A.length);
  const byL={1:[0,0],2:[0,0],3:[0,0]}, byT={};
  A.forEach(a=>{byL[a.q.l][1]++;if(a.ok)byL[a.q.l][0]++;byT[a.q.t]=byT[a.q.t]||[0,0];byT[a.q.t][1]++;if(a.ok)byT[a.q.t][0]++;});
  Object.entries(byT).forEach(([t,[cc,nn]])=>{stats[t]={c:cc,n:nn,at:Date.now()};});
  store.set("itn-trainer-stats",stats);
  const wrong=A.filter(a=>!a.ok);
  const verdict=p>=85?"Уверенный уровень. Добивайте вопросы уровня «Понимание»." :p>=65?"Хорошая база. Пройдите ошибки и слабые темы ещё раз.":p>=40?"Основа есть, но много пробелов. Начните со слабых тем в режиме тренировки.":"Пока рано на экзамен. Пройдите темы по одной в режиме тренировки.";
  app.innerHTML=`
  <section class="panel">
    <h2>Результат</h2>
    <div class="score"><span class="big" style="color:${color(p)}">${p}%</span><span class="count">${c} из ${A.length} верно${S.answers.length<S.qs.length?` · отвечено ${A.length} из ${S.qs.length}`:""}</span></div>
    <p class="sub" style="margin:0">${verdict}</p>
    <div class="levels">${[1,2,3].map(l=>{const [cc,nn]=byL[l];const pp=pct(cc,nn);return `<div class="lv"><span class="n">${wire(l,true)}${LEVELS[l].n}</span><span class="v">${nn?pp+"%":"—"}</span><span class="count">${nn?`${cc} из ${nn}`:"не было вопросов"}</span></div>`}).join("")}</div>
    <div class="tbl-wrap"><table>
      <thead><tr><th>Тема</th><th class="r">Верно</th><th class="r">%</th><th></th></tr></thead>
      <tbody>${Object.entries(byT).sort((a,b)=>pct(...a[1])-pct(...b[1])).map(([t,[cc,nn]])=>{const pp=pct(cc,nn);return `<tr><td>${esc(TOPICS[t].n)}</td><td class="r">${cc}/${nn}</td><td class="r">${pp}</td><td><span class="meter"><i style="width:${pp}%;background:${color(pp)}"></i></span></td></tr>`}).join("")}</tbody>
    </table></div>
    <div class="actions">
      <button type="button" class="btn ghost" id="new">Новый тест</button>
      ${wrong.length?`<button type="button" class="btn" id="retry">Повторить ошибки (${wrong.length})</button>`:""}
    </div>
  </section>
  ${wrong.length?`<section class="panel"><h2>Разбор ошибок</h2><div class="mist">${wrong.map(a=>`
    <div class="mi">
      <div class="qmeta"><span class="tag">${esc(TOPICS[a.q.t].n)}</span><span class="tag">${wire(a.q.l,true)}${LEVELS[a.q.l].n}</span></div>
      <div class="q">${esc(a.q.q)}</div>
      <div class="row yours"><b>Ваш ответ:</b> ${esc(yourText(a.q,a))}</div>
      <div class="row corr"><b>Правильно:</b> ${esc(correctText(a.q))}</div>
      <div class="e">${esc(a.q.e)}</div>
    </div>`).join("")}</div></section>`:""}`;
  document.getElementById("new").onclick=()=>{S=null;renderSetup();window.scrollTo({top:0});};
  const r=document.getElementById("retry");
  if(r)r.onclick=()=>{const src=wrong.map(a=>{const base=Object.assign({},a.q);delete base.opts;delete base.nCorrect;return base;});startQuiz(src);window.scrollTo({top:0});};
  S.done=false;
}

renderSetup();
</script>
</body>
</html>
