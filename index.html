{t:"ios",l:2,q:"Why are network devices usually accessed through a CLI rather than a GUI?",o:["*GUIs can fail, crash or not operate as specified, and the CLI needs fewer resources","The CLI is more user-friendly","GUIs cannot show configuration","The CLI encrypts all commands"],e:"GUI удобнее, но менее надёжен. Поэтому сетевые устройства обычно настраивают через CLI."},
{t:"ios",l:1,q:"Which three programs are terminal emulation programs used to connect to a network device?",o:["*PuTTY","*Tera Term","*SecureCRT","Wireshark","Packet Tracer"],e:"Терминальные эмуляторы подключаются через консоль, SSH или Telnet."},
{t:"ios",l:1,q:"Which command moves from user EXEC mode to privileged EXEC mode?",o:["*enable","configure terminal","login","exit"],e:"enable: > → #. configure terminal: # → (config)#."},
{t:"ios",l:1,q:"Which command enters global configuration mode from privileged EXEC mode?",o:["*configure terminal","enable","line console 0","interface"],e:"configure terminal (сокращённо conf t)."},
{t:"ios",l:2,q:"An administrator is in (config-line)# mode and types interface g0/0. What happens?",o:["*The prompt changes directly to (config-if)#","An error appears: exit is required first","The device returns to global configuration mode","The device returns to privileged EXEC mode"],e:"Из одного подрежима можно сразу перейти в другой, введя его команду."},
{t:"ios",l:2,q:"In the command ping 192.168.10.5, what is 192.168.10.5?",o:["*An argument","A keyword","A prompt","A hot key"],e:"Keyword — заранее определённое слово (ping), argument — значение, которое задаёт пользователь."},
{t:"ios",l:2,q:"In Cisco command syntax notation, what do square brackets [x] mean?",o:["*An optional element","A required element","A required choice","A value supplied by the user"],e:"[x] — необязательно, {x} — обязательно, курсив — значение пользователя, жирный — вводится как есть."},
{t:"ios",l:2,q:"In Cisco command syntax notation, what do braces {x} mean?",o:["*A required element","An optional element","A comment","A delimiting character"],e:"Фигурные скобки — обязательный элемент или выбор."},
{t:"ios",l:2,q:"In Cisco command syntax notation, what does italic text indicate?",o:["*An argument whose value the user supplies","A keyword entered exactly as shown","An optional element","A deprecated command"],e:"Жирный — вводится как есть, курсив — подставляется своё значение."},
{t:"ios",l:1,q:"Which two forms of help does Cisco IOS provide?",o:["*Context-sensitive help","*Command syntax check","Online manual pages","Graphical wizard","Automatic configuration"],e:"? показывает доступные команды и параметры, проверка синтаксиса указывает на ошибку в команде."},
{t:"ios",l:1,q:"Which key completes a partially typed command in the IOS CLI?",o:["*Tab","Space","Ctrl+Z","Up Arrow"],e:"Tab дописывает команду, если начало однозначно."},
{t:"ios",l:2,q:"Which keystroke recalls the most recent command from the history buffer?",o:["*Up Arrow or Ctrl+P","Ctrl+F","Ctrl+B","Tab"],e:"Ctrl+B и Ctrl+F двигают курсор влево и вправо."},
{t:"ios",l:2,q:"While a ping or traceroute is running, which key combination aborts it?",o:["*Ctrl+Shift+6","Ctrl+Z","Ctrl+C","Tab"],e:"Ctrl+Shift+6 — универсальная команда прерывания (DNS-поиск, ping, traceroute)."},
{t:"ios",l:2,q:"The output of a command shows --More--. Which key displays the next full screen?",o:["*Space bar","Enter","Tab","Any other key"],e:"Пробел — следующий экран, Enter — следующая строка, любая другая клавиша прерывает вывод."},
{t:"ios",l:2,q:"Why can the configure command be shortened to conf?",o:["*No other command begins with conf, so the abbreviation is unique","conf is a separate alias command","IOS accepts any three letters","Abbreviations work only in user EXEC mode"],e:"Команду можно сократить до минимума символов, который однозначно её определяет."},
{t:"ios",l:2,q:"Which command returns a switch hostname to its factory default?",o:["*no hostname","hostname default","erase hostname","reload"],e:"no hostname в глобальном режиме возвращает имя «Switch» или «Router»."},
{t:"ios",l:1,q:"What is the first configuration command recommended on any new device?",o:["*Give it a unique hostname","Configure an IP address","Save the configuration","Configure a banner"],e:"Уникальное имя помогает отличать устройства при управлении."},
{t:"ios",l:2,q:"How many VTY lines do many Cisco switches support, and how are they numbered?",o:["*16 lines, numbered 0 to 15","5 lines, numbered 0 to 4","1 line, numbered 0","16 lines, numbered 1 to 16"],e:"Поэтому для коммутатора пишут line vty 0 15."},
{t:"ios",l:2,q:"Which three steps secure console access to a switch?",o:["*line console 0","*password <password>","*login","enable secret <password>","transport input ssh"],e:"enable secret защищает privileged EXEC, а не консоль."},
{t:"ios",l:2,q:"In the command banner motd # Authorized access only #, what is the role of #?",o:["*It is the delimiting character that marks the start and end of the message","It comments out the message","It is the privileged EXEC prompt","It encrypts the banner"],e:"Разделитель ставится до и после текста баннера, вместо # можно выбрать другой символ."},
{t:"ios",l:2,q:"Which command verifies that passwords on a device are now encrypted?",o:["*show running-config","show ip interface brief","show version","show passwords"],e:"После service password-encryption в running-config пароли видны в зашифрованном виде."},
{t:"ios",l:3,q:"Unwanted changes were already saved to the startup-config. How can the device be returned to a clean configuration?",o:["*Use erase startup-config, then reload","Use reload only","Use copy startup-config running-config","Remove the commands one by one from NVRAM with no"],e:"Сохранённое удаляют командой erase startup-config. Перезагрузка очищает running-config в RAM."},
{t:"ios",l:3,q:"Changes were made to the running-config but not saved, and they did not have the desired effect. Which two ways restore the previous configuration?",o:["*Remove the changed commands individually","*Reload the device with the reload command","Use erase startup-config","Use copy running-config startup-config","Use the end command"],e:"Пока изменения не сохранены, их можно отменить вручную или перезагрузкой (с кратким простоем)."},
{t:"ios",l:2,q:"Which three are password guidelines from the course?",o:["*Use passwords longer than eight characters","*Use a mix of upper and lowercase letters, numbers and special characters","*Avoid using the same password on all devices","Use common words so passwords are easy to remember","Use cisco and class in production networks"],e:"cisco и class используются только в лабораторных, в реальных сетях это слабые пароли."},
{t:"ios",l:2,q:"How can a device's configuration be saved to a text file on a PC?",o:["*Enable logging in the terminal emulator, run show running-config, then disable logging","Use copy running-config pc","Use erase startup-config","Use the banner motd command"],e:"Весь вывод сессии записывается в файл, пока включено логирование в PuTTY или Tera Term."},
{t:"ios",l:2,q:"Which IOS mode allows only a limited number of basic monitoring commands?",o:["*User EXEC mode","Privileged EXEC mode","Global configuration mode","Line configuration mode"],e:"User EXEC (>) — только базовый просмотр."},

/* Лекция 2: протоколы и модели */
{t:"models",l:1,q:"Which three elements does every communication have?",o:["*A source (sender)","*A destination (receiver)","*A channel (media)","A router","A protocol analyzer"],e:"Отправитель, получатель и канал."},
{t:"models",l:2,q:"Which five requirements must common computer protocols agree on?",o:["*Message encoding","*Message formatting and encapsulation","*Message size","*Message timing","*Message delivery options","Message encryption"],e:"Шифрование — функция протоколов безопасности, а не общее требование ко всем протоколам."},
{t:"models",l:2,q:"Why must a long message be broken into pieces before it is sent?",o:["*Frames have minimum and maximum size limits","Long messages cannot be encoded","Switches drop messages longer than one frame","Broadcasts are limited to one piece"],e:"Каждый кусок идёт в своём кадре со своей адресацией и собирается у получателя."},
{t:"models",l:2,q:"Which part of message timing determines how long a device waits when it hears no reply?",o:["*Response timeout","Flow control","Access method","Encoding"],e:"Flow control — скорость, response timeout — ожидание, access method — когда можно говорить."},
{t:"models",l:2,q:"Which part of message timing determines when a device can send a message?",o:["*Access method","Flow control","Response timeout","Sequencing"],e:"Метод доступа решает, когда можно передавать, чтобы избежать коллизий."},
{t:"models",l:2,q:"Which delivery option is not available in IPv6?",o:["*Broadcast","Unicast","Multicast","Anycast"],e:"Broadcast есть только в IPv4. В IPv6 добавлен anycast."},
{t:"models",l:2,q:"Which type of protocol enables routers to exchange route information and select the best path?",o:["*Routing protocol","Service discovery protocol","Network security protocol","Network communications protocol"],e:"Например OSPF и BGP."},
{t:"models",l:2,q:"Which type of protocol is used for the automatic detection of devices or services?",o:["*Service discovery protocol","Routing protocol","Network security protocol","Transport protocol"],e:"Например DHCP и DNS."},
{t:"models",l:2,q:"Which type of protocol secures data with authentication, integrity and encryption?",o:["*Network security protocol","Routing protocol","Service discovery protocol","Data link protocol"],e:"Например SSH, SSL, TLS."},
{t:"models",l:2,q:"Which protocol function determines whether data was corrupted during transmission?",o:["*Error detection","Sequencing","Addressing","Flow control"],e:"Addressing — кто отправитель и получатель, sequencing — нумерация, flow control — скорость."},
{t:"models",l:2,q:"Which protocol function provides process-to-process communication between network applications?",o:["*Application interface","Reliability","Sequencing","Addressing"],e:"Application interface связывает сетевые приложения."},
{t:"models",l:2,q:"Which protocol manages individual conversations, guarantees delivery and manages flow control?",o:["*TCP","IP","HTTP","Ethernet"],e:"HTTP — взаимодействие веб-клиента и сервера, IP — доставка между сетями, Ethernet — от NIC до NIC в одной сети."},
{t:"models",l:2,q:"Which protocol delivers messages from one NIC to another NIC on the same network?",o:["*Ethernet","IP","TCP","HTTP"],e:"Ethernet работает в пределах одной сети. Между сетями доставляет IP."},
{t:"models",l:1,q:"Which protocol suite is maintained by the IETF?",o:["*TCP/IP","OSI protocols","AppleTalk","Novell NetWare"],e:"OSI-протоколы разработали ISO и ITU. AppleTalk и NetWare — проприетарные наборы."},
{t:"models",l:2,q:"Which two statements describe the TCP/IP protocol suite?",o:["*It is an open standard that any vendor can use","*It is endorsed by the industry and approved by standards organizations","It is proprietary to Cisco","It was developed by Apple","It specifies one physical medium"],e:"TCP/IP открыт и стандартизирован, поэтому оборудование разных вендоров совместимо."},
{t:"models",l:2,q:"Which three outcomes do open standards encourage?",o:["*Interoperability","*Competition","*Innovation","Vendor lock-in","Higher prices"],e:"Открытые стандарты дают совместимость, конкуренцию и инновации."},
{t:"models",l:2,q:"Which organization focuses on long-term research related to internet and TCP/IP protocols?",o:["*IRTF","IETF","IAB","ISOC"],e:"IRTF — исследования на будущее, IETF — разработка протоколов, IAB — управление стандартами, ISOC — продвижение открытого интернета."},
{t:"models",l:2,q:"Which organization is responsible for the management and development of internet standards?",o:["*IAB","IRTF","EIA","TIA"],e:"IAB (Internet Architecture Board)."},
{t:"models",l:2,q:"Which organization develops standards for electrical wiring, connectors and 19-inch equipment racks?",o:["*EIA","TIA","IEEE","ITU-T"],e:"EIA — проводка, разъёмы и стойки 19 дюймов."},
{t:"models",l:2,q:"Which organization develops standards for radio equipment, cellular towers, VoIP devices and satellite communications?",o:["*TIA","EIA","IANA","IRTF"],e:"TIA — телекоммуникационное оборудование."},
{t:"models",l:2,q:"Which organization defines standards for video compression, IPTV and DSL?",o:["*ITU-T","IEEE","EIA","ICANN"],e:"ITU-T — электросвязь: сжатие видео, IPTV, DSL."},
{t:"models",l:2,q:"Which OSI layer provides a common representation of the data transferred between application layer services?",o:["*Presentation layer","Session layer","Application layer","Transport layer"],e:"Уровень представления отвечает за формат данных."},
{t:"models",l:2,q:"Which OSI layer describes methods for exchanging data frames over a common media?",o:["*Data link layer","Physical layer","Network layer","Transport layer"],e:"Кадры и доступ к общей среде — канальный уровень."},
{t:"models",l:2,q:"Which OSI layer describes the means to activate, maintain and deactivate physical connections?",o:["*Physical layer","Data link layer","Network layer","Session layer"],e:"Физический уровень."},
{t:"models",l:2,q:"Which TCP/IP layer determines the best path through the network?",o:["*Internet","Transport","Network access","Application"],e:"Выбор пути — internet layer (сетевой уровень OSI)."},
{t:"models",l:2,q:"Which two TCP/IP layers does the OSI model divide into multiple layers?",o:["*Application","*Network access","Transport","Internet","Presentation"],e:"Application TCP/IP = уровни 5–7 OSI, Network access = уровни 1–2 OSI."},
{t:"models",l:2,q:"Which two benefits come from segmenting messages?",o:["*Increased speed, because a link is not tied up by one large transfer","*Increased efficiency, because only failed segments are retransmitted","It removes the need for addressing","It encrypts the data","It guarantees delivery"],e:"Сегментация позволяет перемешивать разговоры и повторять только потерянное."},
{t:"models",l:2,q:"Which protocol is responsible for sequencing individual segments?",o:["*TCP","IP","UDP","Ethernet"],e:"Порядковые номера сегментов ставит TCP."},
{t:"models",l:2,q:"In which order are PDUs processed during de-encapsulation at the receiver?",o:["*Bits, frame, packet, segment, data","Data, segment, packet, frame, bits","Frame, bits, packet, segment, data","Segment, packet, frame, bits, data"],e:"Получатель снимает заголовки снизу вверх."},
{t:"models",l:2,q:"In IPv6 terminology, what are the network portion and host portion of an address called?",o:["*Prefix and interface ID","Network ID and host ID","Subnet and mask","Global ID and local ID"],e:"В IPv4: network и host portion, в IPv6: prefix и interface ID."},
{t:"models",l:1,q:"Which address type is responsible for delivering the IP packet from the original source to the final destination?",o:["*Network layer (IP) addresses","Data link (MAC) addresses","Port numbers","Physical port numbers"],e:"MAC-адреса доставляют кадр только от одного NIC до следующего в той же сети."},
{t:"models",l:3,q:"PC1 (192.168.1.110) sends a file to an FTP server at 192.168.1.9 on the same network. Which destination MAC address is used?",o:["*The MAC address of the FTP server's NIC","The MAC address of the default gateway","FF-FF-FF-FF-FF-FF","The MAC address of the switch"],e:"Сеть одна и та же, поэтому кадр идёт прямо получателю, роутер не нужен."},
{t:"models",l:3,q:"As a packet crosses three links to reach a web server, how do the frame and packet change?",o:["*A new frame is built for each link, but the packet's IP addresses stay the same","The packet is rebuilt on each link, but the frame stays the same","Both the frame and the packet stay the same","Both change their addresses on each link"],e:"Пакет не изменяется (кроме TTL), а кадр заменяется на каждом участке."},
{t:"models",l:3,q:"Why does a host need the default gateway address before it can send traffic to remote networks?",o:["*Its traffic is otherwise confined to the local network, because frames for remote destinations go to the gateway's MAC","The gateway assigns the host's IP address","The gateway translates names into IP addresses","Without it the host cannot reach local hosts either"],e:"Шлюз — «дверь» из LAN. Без него хост общается только со своей сетью."},

/* Лекция 3: физический уровень */
{t:"phys",l:2,q:"Which three functional areas do physical layer standards address?",o:["*Physical components","*Encoding","*Signaling","Addressing","Error detection"],e:"Адресация и обнаружение ошибок — задачи канального уровня."},
{t:"phys",l:2,q:"Which three are examples of encoding methods?",o:["*Manchester","*4B/5B","*8B/10B","CSMA/CD","T568B"],e:"T568B — схема разводки, CSMA/CD — метод доступа к среде."},
{t:"phys",l:2,q:"What does the signaling method define?",o:["*How the bit values 1 and 0 are represented on the physical medium","How frames are addressed","How collisions are detected","How cables are terminated"],e:"На меди — электрические сигналы, на оптике — импульсы света, в эфире — радиосигналы."},
{t:"phys",l:2,q:"How many bits per second is 1 Gbps?",o:["*1,000,000,000 bps (10^9)","1,000,000 bps (10^6)","1,024 Mbps","1,000 Kbps"],e:"Kbps = 10^3, Mbps = 10^6, Gbps = 10^9, Tbps = 10^12."},
{t:"phys",l:2,q:"Which formula describes goodput?",o:["*Goodput = throughput − traffic overhead","Goodput = bandwidth − latency","Goodput = throughput + latency","Goodput = bandwidth × throughput"],e:"Goodput — только полезные данные."},
{t:"phys",l:1,q:"Which term means the amount of time, including delays, for data to travel from one point to another?",o:["*Latency","Throughput","Bandwidth","Goodput"],e:"Latency — задержка."},
{t:"phys",l:2,q:"What is attenuation in copper cabling?",o:["*The weakening of a signal the farther it travels","Interference from neighboring wires","Interference from radio signals","Spreading of a light pulse over time"],e:"С затуханием борются, соблюдая ограничения длины кабеля."},
{t:"phys",l:2,q:"Which two sources of interference can distort signals on copper cable?",o:["*EMI and RFI","*Crosstalk","Dispersion","Attenuation","Cancellation"],e:"Dispersion относится к оптике, attenuation — ослабление, а не помеха, cancellation — способ защиты."},
{t:"phys",l:2,q:"How does STP compare with UTP?",o:["*Better noise protection, but more expensive and harder to install","Cheaper and easier to install","Uses different connectors than RJ-45","Cannot connect hosts to switches"],e:"У STP фольга или оплётка против EMI/RFI, разъём тот же RJ-45."},
{t:"phys",l:2,q:"In a coaxial cable, what acts as the second wire in the circuit and as a shield?",o:["*The woven copper braid or metallic foil","The copper center conductor","The plastic insulation","The outer jacket"],e:"Центральная жила передаёт сигнал, оплётка — второй провод и экран."},
{t:"phys",l:2,q:"Which two situations commonly use coaxial cable?",o:["*Attaching antennas to wireless devices","*Cable internet customer premises wiring","Building backbones between floors","Connecting a PC to a switch","Submarine networks"],e:"Коаксиальный кабель — антенны и кабельный интернет."},
{t:"phys",l:2,q:"Which organizations establish the standards for UTP cabling?",o:["*TIA/EIA set the cabling standards (TIA/EIA-568), and IEEE rates cable categories","IETF and IANA","ISO only","ITU-T and ICANN"],e:"TIA/EIA-568 задаёт типы, длины, разъёмы и разводку, IEEE — электрические категории (Cat 5e, Cat 6)."},
{t:"phys",l:2,q:"How is an Ethernet crossover cable wired?",o:["*T568A on one end and T568B on the other","T568B on both ends","T568A on both ends","Pins reversed completely (rollover)"],e:"Прямой — одинаковая разводка на обоих концах, перекрёстный — разная."},
{t:"phys",l:2,q:"Which two connections traditionally use a crossover cable?",o:["*Switch to switch","*Router to router","PC to switch","Switch to router","PC console to router"],e:"Перекрёстный кабель — для одинаковых устройств (сейчас обычно не нужен из-за auto-MDIX)."},
{t:"phys",l:3,q:"A PC must be connected directly to a router Ethernet port with no switch. Which cable is traditionally required?",o:["*Crossover","Straight-through","Rollover","Coaxial"],e:"ПК и роутер считаются устройствами одного типа (хост-хост), поэтому классически нужен перекрёстный кабель."},
{t:"phys",l:2,q:"What is the main difference in the core between single-mode and multimode fiber?",o:["*Single-mode has a very small core, multimode has a larger core","Single-mode has a larger core","Both have the same core size","Multimode has no core"],e:"Узкая сердцевина SMF пропускает один луч лазера, поэтому меньше дисперсия."},
{t:"phys",l:2,q:"What is dispersion in fiber-optic cabling?",o:["*The spreading out of a light pulse over time","The weakening of an electrical signal","Interference between wires","Reflection at the connector"],e:"Чем больше дисперсия, тем больше потеря сигнала. У MMF она больше, отсюда предел ~550 м."},
{t:"phys",l:2,q:"Which four types of industry use fiber-optic cabling?",o:["*Enterprise networks","*Fiber-to-the-home (FTTH)","*Long-haul networks","*Submarine cable networks","Bluetooth personal networks"],e:"В курсе основной фокус — оптика в корпоративных сетях."},
{t:"phys",l:2,q:"Which fiber connector is a small connector that is popular and often comes in a duplex version?",o:["*LC (Lucent Connector)","ST (Straight-Tip)","SC (Subscriber Connector)","RJ-45"],e:"Оптические разъёмы: ST, SC, LC, duplex LC. RJ-45 — для витой пары."},
{t:"phys",l:2,q:"Which jacket colors identify fiber patch cords?",o:["*Yellow for single-mode, orange or aqua for multimode","Orange for single-mode, yellow for multimode","Blue for single-mode, green for multimode","All fiber cords are black"],e:"Жёлтый — одномодовое, оранжевый или бирюзовый — многомодовое."},
{t:"phys",l:2,q:"What maximum distance does UTP support, compared with fiber?",o:["*About 100 m for UTP, up to about 100 km for fiber","About 1 km for UTP, 10 km for fiber","About 550 m for UTP, 100 m for fiber","Both about 100 m"],e:"Таблица из лекции: UTP 1–100 м, оптика 1–100 000 м."},
{t:"phys",l:3,q:"Which media should connect two buildings 300 m apart on a campus with high traffic between them?",o:["*Multimode or single-mode fiber","UTP Cat 6","Coaxial cable","Bluetooth"],e:"300 м — больше предела UTP (100 м). Оптика — стандартная магистраль между зданиями."},
{t:"phys",l:2,q:"Which two devices does a wireless LAN require?",o:["*Wireless access point","*Wireless NIC adapters","Crossover cable","Fiber transceiver","Coaxial splitter"],e:"AP собирает сигналы клиентов и подключает их к проводной сети."},
{t:"phys",l:2,q:"Which wireless standard uses a point-to-multipoint topology to provide broadband wireless access?",o:["*WiMAX (IEEE 802.16)","Wi-Fi (IEEE 802.11)","Bluetooth (IEEE 802.15)","Zigbee (IEEE 802.15.4)"],e:"WiMAX — беспроводной широкополосный доступ."},
{t:"phys",l:2,q:"Which wireless limitation exists because anyone in range can receive the transmission?",o:["*Security","Coverage area","Interference","Shared medium"],e:"Физический доступ к кабелю не нужен, поэтому беспроводную сеть нужно защищать шифрованием."},
{t:"phys",l:2,q:"Which two layers do wireless data communication standards cover?",o:["*Data link","*Physical","Network","Transport","Application"],e:"Беспроводные стандарты IEEE описывают кодирование, частоты, мощность и доступ к среде."},
{t:"phys",l:1,q:"What does the physical layer accept from the data link layer?",o:["*A complete frame","A segment","A packet","A data stream"],e:"Физический уровень кодирует кадр в сигналы. Это последний шаг инкапсуляции."},
{t:"phys",l:3,q:"A technician must choose cabling for a hospital MRI room with strong electromagnetic fields and electrical hazards. Which choice is best?",o:["*Fiber-optic, because it is completely immune to EMI, RFI and electrical hazards","UTP, because it is cheapest","STP, because it is immune to electrical hazards","Coaxial, because it has a shield"],e:"Только оптика полностью невосприимчива к помехам и не проводит электричество."},

/* Лекция 3: системы счисления */
{t:"num",l:1,q:"Convert binary 11000000 to decimal.",a:["192"],ph:"число",e:"128 + 64 = 192."},
{t:"num",l:1,q:"Convert decimal 168 to an 8-bit binary number.",a:["10101000"],ph:"8 бит",e:"168 = 128 + 32 + 8 → 10101000 (пример из лекции 3)."},
{t:"num",l:2,q:"Convert decimal 168 to hexadecimal.",a:["a8","0xa8"],ph:"hex",e:"168 = 10101000. Группы по 4 бита: 1010 = A, 1000 = 8 → A8."},
{t:"num",l:2,q:"Convert the hexadecimal value D2 to decimal.",a:["210"],ph:"число",e:"D2 = 1101 0010 = 11010010 = 128 + 64 + 16 + 2 = 210."},
{t:"num",l:2,q:"Convert 192.168.11.10 to binary.",o:["*11000000.10101000.00001011.00001010","11000000.10101000.00001101.00001010","11000000.10100100.00001011.00001010","11000000.10101000.00001011.00000101"],e:"192 = 11000000, 168 = 10101000, 11 = 00001011, 10 = 00001010."},
{t:"num",l:2,q:"How many hexadecimal digits make up an IPv6 address?",a:["32"],ph:"число",e:"128 бит / 4 бита на цифру = 32 hex-цифры, по 4 в каждом хекстете."},
{t:"num",l:1,q:"What is a hextet?",o:["*A group of four hexadecimal digits (16 bits) in an IPv6 address","Six hexadecimal digits","An 8-bit group in an IPv4 address","A group of 6 bytes in a MAC address"],e:"IPv6 = 8 хекстетов по 16 бит."},
{t:"num",l:2,q:"Convert binary 11111111 to hexadecimal.",a:["ff","0xff"],ph:"hex",e:"1111 = F, 1111 = F → FF = 255."},
{t:"num",l:2,q:"What is the largest decimal value one octet can hold?",a:["255"],ph:"число",e:"8 единиц: 11111111 = 255. Поэтому октет IPv4 — от 0 до 255."},
{t:"num",l:3,q:"A MAC address is written as 00-1A-2B-3C-4D-5E. How many bits does it contain, and how many of them form the OUI?",o:["*48 bits; the first 24 bits are the OUI","48 bits; the first 16 bits are the OUI","32 bits; the first 24 bits are the OUI","64 bits; the first 32 bits are the OUI"],e:"12 hex-цифр × 4 = 48 бит. Первые 3 байта (24 бита) — код производителя."}
);

/* Лекции 4–5: детали со слайдов */
BANK.push(
/* Лекция 4: канальный уровень */
{t:"l2",l:1,q:"What does the data link layer encapsulate into Layer 2 frames?",o:["*Layer 3 packets (IPv4 and IPv6)","Layer 4 segments","Application data","Physical bits"],e:"Канальный уровень берёт пакет сетевого уровня и упаковывает его в кадр."},
{t:"l2",l:2,q:"Which IEEE standards define the Ethernet family of technologies?",o:["*IEEE 802.2 and 802.3","IEEE 802.11 and 802.15","IEEE 802.1 and 802.16","IEEE 802.3 and 802.11"],e:"802.2 — подуровень LLC, 802.3 — Ethernet (MAC и физический уровень)."},
{t:"l2",l:2,q:"Which IEEE standard defines the LLC sublayer?",o:["*IEEE 802.2","IEEE 802.3","IEEE 802.11","IEEE 802.15"],e:"LLC — 802.2. MAC — 802.3 (Ethernet), 802.11 (WLAN), 802.15 (WPAN)."},
{t:"l2",l:2,q:"Which three items are part of IEEE 802.3 data encapsulation in the MAC sublayer?",o:["*The internal structure of the Ethernet frame","*Source and destination MAC addressing","*The FCS trailer for error detection","IP addressing","Port numbers"],e:"Кадр, адресация и обнаружение ошибок — задачи MAC-подуровня."},
{t:"l2",l:2,q:"Which four organizations define data link layer protocols?",o:["*IEEE","*ITU","*ISO","*ANSI","IETF"],e:"IETF занимается протоколами TCP/IP верхних уровней, а не канальным уровнем."},
{t:"l2",l:2,q:"Which is the simplest and most common WAN topology?",o:["*Point-to-point","Hub-and-spoke","Mesh","Bus"],e:"Постоянный канал между двумя узлами. Протоколы для него простые, потому что кадр может идти только к одному узлу."},
{t:"l2",l:2,q:"Which WAN topology has a central site that connects branch sites through point-to-point links?",o:["*Hub-and-spoke","Mesh","Point-to-point","Ring"],e:"Хаб-и-спицы похожа на звезду."},
{t:"l2",l:2,q:"Which three statements describe star and extended star LAN topologies?",o:["*They are easy to install","*They are very scalable","*They are easy to troubleshoot","Every device connects to every other device","End systems are chained and terminated at each end"],e:"Сетка — каждый с каждым, шина — цепочка с терминаторами."},
{t:"l2",l:2,q:"Which legacy LAN topology connects each end system to its neighbors to form a ring?",o:["*Ring","Bus","Star","Mesh"],e:"Шина и кольцо — устаревшие топологии Ethernet и Token Ring."},
{t:"l2",l:2,q:"What is controlled (deterministic) access?",o:["*Each node has its own time to use the medium","Nodes compete and recover from collisions","Nodes send whenever they want","Only switches may send"],e:"Детерминированный доступ использовался в Token Ring и ARCNET."},
{t:"l2",l:3,q:"How does CSMA/CA try to avoid collisions?",o:["*A transmitting device includes the time it needs, so others know how long the medium will be busy","Devices detect a collision and wait a random time","Devices take turns using a token","A switch schedules each transmission"],e:"CSMA/CD обнаруживает коллизию и ждёт случайное время. CSMA/CA сообщает длительность передачи заранее."},
{t:"l2",l:3,q:"What happens in CSMA/CD after two devices transmit at the same time?",o:["*Both detect the collision, wait a random period and retransmit","Both stop permanently","The switch resends the frames","Only the device with the lower MAC retransmits"],e:"Случайная задержка снижает шанс новой коллизии."},
{t:"l2",l:2,q:"Which frame field identifies the encapsulated Layer 3 protocol?",o:["*Type","Addressing","Control","Error detection"],e:"Поля кадра: начало и конец, адресация, тип (протокол L3), управление, данные, обнаружение ошибок."},
{t:"l2",l:2,q:"Which frame field identifies flow control services?",o:["*Control","Type","Addressing","Frame start"],e:"Поле Control — сервисы управления потоком."},
{t:"l2",l:2,q:"Which three are characteristics of Layer 2 addresses?",o:["*They are physical addresses in the frame header","*They are used only for local delivery on the link","*They are updated by each device that forwards the frame","They stay the same from source to final destination","They are 32 bits long"],e:"MAC-адрес меняется на каждом участке, IP-адрес остаётся."},
{t:"l2",l:2,q:"Which two data link protocols are typically used on WAN links?",o:["*PPP","*HDLC","Ethernet","802.11","CSMA/CD"],e:"Также Frame Relay. Ethernet и 802.11 — LAN-протоколы."},
{t:"l2",l:2,q:"Why is the Preamble not counted in the 64–1518 byte Ethernet frame size?",o:["*The frame size is measured from the destination MAC address through the FCS","The Preamble is part of the IP packet","The Preamble is added by the switch only","The Preamble is optional"],e:"Preamble и SFD служат для синхронизации и в размер кадра не входят."},
{t:"l2",l:2,q:"What is a frame with more than 1500 bytes of data called?",o:["*A jumbo or baby giant frame","A runt frame","A collision fragment","A multicast frame"],e:"Кадр меньше 64 байт — runt (collision fragment), больше 1500 байт данных — jumbo/baby giant."},
{t:"l2",l:2,q:"How are hexadecimal values distinguished from decimal values in documentation?",o:["*With a 0x prefix, a subscript 16, or an H suffix","With a # prefix","With a % suffix","They are always written in capitals"],e:"Например 0x73, 73₁₆ или 73H."},
{t:"l2",l:2,q:"How is the binary value 0000 1010 written in hexadecimal in a MAC address?",o:["*0A","A","10","A0"],e:"Ведущие нули всегда пишутся, чтобы байт занимал 2 hex-цифры."},
{t:"l2",l:1,q:"How long is a MAC address in bytes?",o:["*6 bytes","4 bytes","8 bytes","16 bytes"],e:"48 бит = 6 байт = 12 hex-цифр."},
{t:"l2",l:2,q:"Which organization assigns the OUI to vendors of Ethernet devices?",o:["*IEEE","IANA","IETF","ICANN"],e:"Производители регистрируются в IEEE и получают уникальный 24-битный OUI."},
{t:"l2",l:2,q:"A NIC receives a frame. Which three destination MAC addresses will it accept?",o:["*Its own MAC address","*The broadcast address","*A multicast address of a group the host belongs to","Any unicast MAC on the LAN","The MAC of the default gateway"],e:"Остальные кадры сетевая карта отбрасывает."},
{t:"l2",l:2,q:"Which statement about the source MAC address in a frame is true?",o:["*It must always be a unicast address","It can be a multicast address","It can be the broadcast address","It is the address of the default gateway"],e:"Multicast и broadcast бывают только адресом получателя."},
{t:"l2",l:2,q:"An IPv4 broadcast packet is encapsulated in a frame. What is the destination MAC address, and where does the frame go?",o:["*FF-FF-FF-FF-FF-FF; flooded out all switch ports except the incoming port, not forwarded by a router","FF-FF-FF-FF-FF-FF; forwarded to every network by routers","01-00-5E-00-00-01; sent only to the router","00-00-00-00-00-00; dropped by the switch"],e:"Broadcast MAC — 48 единиц. Коммутатор его рассылает, роутер не пропускает."},
{t:"l2",l:2,q:"What is the multicast MAC prefix used for an IPv6 multicast packet?",o:["*33-33","01-00-5E","FF-FF","00-00-0C"],e:"IPv4 multicast → 01-00-5E, IPv6 multicast → 33-33."},
{t:"l2",l:3,q:"How does a switch handle multicast frames by default?",o:["*It floods them out all ports except the incoming port, unless multicast snooping is configured","It drops them","It forwards them only to the router","It treats them like known unicast"],e:"Без настройки multicast snooping коммутатор не знает членов группы."},
{t:"l2",l:3,q:"On what does a Layer 2 switch base its forwarding decisions?",o:["*Only on the Layer 2 Ethernet MAC addresses in the frame","On the IP addresses in the packet","On the TCP port numbers","On the protocol carried in the data field"],e:"Коммутатор не знает, что внутри кадра: IPv4, ARP или IPv6 ND."},
{t:"l2",l:2,q:"What is another name for the MAC address table?",o:["*CAM table","ARP table","Routing table","FIB"],e:"Content Addressable Memory."},
{t:"l2",l:2,q:"By default, how long do most Ethernet switches keep an entry in the MAC address table?",o:["*5 minutes","30 seconds","4 hours","Until the switch reloads"],e:"Если кадр от того же адреса приходит снова, таймер записи обновляется."},
{t:"l2",l:2,q:"What does a switch do when a frame arrives with a source MAC address that is already in the table?",o:["*It refreshes the timer for that entry","It deletes the entry","It floods the frame","It adds a duplicate entry"],e:"Если адрес пришёл на другой порт, запись обновляется на новый порт."},
{t:"l2",l:2,q:"What is an unknown unicast?",o:["*A unicast frame whose destination MAC is not in the MAC address table, so it is flooded","A frame with a broadcast destination","A frame with an invalid FCS","A frame sent to a multicast group"],e:"Неизвестный unicast рассылается во все порты, кроме входного."},
{t:"l2",l:3,q:"How does a switch differ from a legacy hub in forwarding?",o:["*A switch uses its MAC table to forward to one port; a hub repeats bits out all ports except the incoming one","A hub uses a MAC table; a switch floods everything","Both forward only to one port","A switch works at Layer 3; a hub at Layer 2"],e:"Хаб — физический повторитель, коммутатор фильтрует кадры по MAC."},
{t:"l2",l:2,q:"What does a store-and-forward switch compute before forwarding a frame?",o:["*The CRC of the whole frame","The TTL","The IP checksum","The TCP window"],e:"Если CRC неверен, кадр отбрасывается и не тратит полосу."},
{t:"l2",l:3,q:"Why is store-and-forward switching required for QoS on converged networks?",o:["*The switch must receive the whole frame to classify it for traffic prioritization","It is the fastest method","It does not check errors","It reads only the destination MAC"],e:"Для классификации трафика нужно видеть весь кадр."},
{t:"l2",l:2,q:"Which cut-through variant offers the lowest latency?",o:["*Fast-forward switching","Fragment-free switching","Store-and-forward switching","Shared memory switching"],e:"Fast-forward пересылает сразу после адреса получателя. Ошибочные кадры отбросит NIC получателя."},
{t:"l2",l:3,q:"Which statement describes fragment-free switching?",o:["*A compromise between store-and-forward integrity and fast-forward latency","The fastest method with no error checking","A method that checks the whole frame CRC","A method used only for multicast"],e:"Он ждёт первые 64 байта, в которых обычно проявляются коллизии."},
{t:"l2",l:3,q:"Which memory buffering method can let one frame delay all frames behind it because its destination port is busy?",o:["*Port-based memory buffering","Shared memory buffering","Cut-through buffering","CAM buffering"],e:"В port-based очереди привязаны к портам. В shared memory буфер общий и выделяется динамически."},
{t:"l2",l:2,q:"In which duplex mode do Gigabit Ethernet ports operate?",o:["*Full-duplex only","Half-duplex only","Both half and full","Simplex"],e:"Гигабитные порты работают только в full-duplex."},
{t:"l2",l:3,q:"What is the best practice for duplex settings on an Ethernet link?",o:["*Both sides should use autonegotiation, or both should be set manually, preferably to full-duplex","One side on auto and the other set manually","Always use half-duplex","Disable duplex on switches"],e:"Несовпадение настроек — частая причина duplex mismatch."},
{t:"l2",l:2,q:"Which interface command re-enables auto-MDIX on a switch port?",o:["*mdix auto","auto-mdix enable","duplex auto","speed auto"],e:"Auto-MDIX включён по умолчанию начиная с IOS 12.2(18)SE, но его можно выключить."},
{t:"l2",l:3,q:"Why should you still use the correct cable type even when switches support auto-MDIX?",o:["*Auto-MDIX could be disabled on a port","Auto-MDIX works only on fiber","Auto-MDIX slows down links","Auto-MDIX is not supported by Cisco"],e:"Функция может быть выключена, поэтому полагаться только на неё нельзя."},

/* Лекция 5: сетевой уровень */
{t:"l3",l:1,q:"Which four basic operations does the network layer perform?",o:["*Addressing end devices","*Encapsulation","*Routing","*De-encapsulation","Segmentation"],e:"Сегментация — задача транспортного уровня."},
{t:"l3",l:2,q:"Which statement about IP encapsulation is true?",o:["*IPv4 or IPv6 can be used without affecting the Layer 4 segment","The IP header changes the TCP port numbers","IP encapsulates frames","Only the destination router examines the IP header"],e:"Пакет просматривают все устройства Layer 3 на пути."},
{t:"l3",l:2,q:"Which three statements describe IP as best effort and unreliable?",o:["*IP cannot retransmit after an error","*IP does not expect acknowledgments","*IP cannot realign out-of-sequence packets","IP guarantees delivery","IP establishes a session first"],e:"Эти функции IP оставляет протоколам верхних уровней, обычно TCP."},
{t:"l3",l:2,q:"What do you call it when Layer 3 splits an IPv4 packet into smaller units?",o:["*Fragmentation","Segmentation","Encapsulation","Multiplexing"],e:"Фрагментация увеличивает задержку. Роутеры не фрагментируют IPv6."},
{t:"l3",l:2,q:"From where does the network layer learn the MTU?",o:["*From control information sent by the data link layer","From the transport layer","From the DNS server","From the default gateway"],e:"Канальный уровень знает ограничения своей среды и сообщает MTU вверх."},
{t:"l3",l:2,q:"What is the value of the Version field in an IPv4 header, in binary?",o:["*0100","0110","0001","1000"],e:"Version — 4 бита: 0100 для IPv4, 0110 для IPv6."},
{t:"l3",l:2,q:"What is the value of the Version field in an IPv6 header, in binary?",o:["*0110","0100","0101","1100"],e:"6 = 0110."},
{t:"l3",l:2,q:"Which IPv4 header field is used for QoS?",o:["*Differentiated Services (DS), formerly Type of Service","Protocol","TTL","Header Checksum"],e:"DS (DiffServ) или старое ToS. В IPv6 его аналог — Traffic Class."},
{t:"l3",l:2,q:"Which IPv4 header field identifies the next-level protocol such as ICMP, TCP or UDP?",o:["*Protocol","Version","Differentiated Services","TTL"],e:"В IPv6 эту роль играет Next Header."},
{t:"l3",l:2,q:"How long are the source and destination address fields in an IPv4 header?",o:["*32 bits each","128 bits each","48 bits each","16 bits each"],e:"В IPv6 — по 128 бит."},
{t:"l3",l:2,q:"In what order is an IPv4 header diagram read?",o:["*Left to right, 4 bytes per line","Right to left, 8 bytes per line","Top to bottom, 1 byte per line","Left to right, 2 bytes per line"],e:"По 32 бита (4 байта) на строку."},
{t:"l3",l:2,q:"How long is the fixed IPv6 header?",o:["*40 bytes","20 bytes","60 bytes","128 bytes"],e:"IPv6-заголовок упрощён, но не меньше: фиксированно 40 байт. У IPv4 — от 20 байт."},
{t:"l3",l:2,q:"Which three IPv4 header fields were removed in IPv6 to improve performance?",o:["*Flag","*Fragment Offset","*Header Checksum","Protocol","Source Address"],e:"Также убран IHL: заголовок IPv6 всегда 40 байт. Protocol не удалён, а заменён на Next Header, TTL — на Hop Limit."},
{t:"l3",l:2,q:"Which IPv6 header field is equivalent to the IPv4 DS field and is used for QoS?",o:["*Traffic Class","Flow Label","Next Header","Payload Length"],e:"Traffic Class — классификация трафика для QoS."},
{t:"l3",l:2,q:"Which IPv6 header field tells devices to handle packets with the same value in the same way?",o:["*Flow Label","Traffic Class","Hop Limit","Next Header"],e:"Flow Label — 20 бит, помечает поток пакетов."},
{t:"l3",l:2,q:"How long is the IPv6 Flow Label field?",o:["*20 bits","16 bits","8 bits","32 bits"],e:"Flow Label — 20 бит, Payload Length — 16 бит, Version — 4 бита."},
{t:"l3",l:2,q:"Which IPv6 header field gives the length of the data portion of the packet?",o:["*Payload Length (16 bits)","Flow Label","Next Header","Traffic Class"],e:"Payload Length — 16 бит, длина данных без базового заголовка."},
{t:"l3",l:2,q:"Which IPv6 header field identifies the next-level protocol, such as TCP, UDP or ICMPv6?",o:["*Next Header","Payload Length","Flow Label","Hop Limit"],e:"Next Header заменяет поле Protocol из IPv4 и также указывает на заголовки расширения."},
{t:"l3",l:2,q:"Which three statements describe IPv6 extension headers?",o:["*They are optional","*They are placed between the IPv6 header and the payload","*They can be used for fragmentation, security or mobility","They replace the IPv6 base header","They are always 40 bytes"],e:"Заголовки расширения несут необязательную информацию сетевого уровня."},
{t:"l3",l:3,q:"An IPv6 packet must be fragmented. Which device does it?",o:["*The source host, using an extension header; routers do not fragment IPv6","Every router on the path","Only the last router","The destination host"],e:"В IPv6 роутеры не фрагментируют пакеты. Если фрагментация нужна, это делает отправитель."},
{t:"l3",l:2,q:"Which organization developed IPv6?",o:["*IETF","IEEE","IANA","ITU"],e:"IPv6 разработан IETF."},
{t:"l3",l:2,q:"Which three improvements does IPv6 provide?",o:["*Increased address space","*Improved packet handling with a simplified header","*No need for NAT","Smaller header than IPv4","Support for broadcast"],e:"Заголовок IPv6 упрощён, но больше (40 байт), broadcast в IPv6 нет."},
{t:"l3",l:3,q:"Why does NAT cause problems on a network, according to the course?",o:["*It manipulates header addressing, which adds latency and makes troubleshooting harder","It encrypts all traffic","It blocks all broadcasts","It uses too many public addresses"],e:"NAT задумывался как временное решение и усложняет сеть."},
{t:"l3",l:2,q:"Which three types of destinations can a host send packets to?",o:["*Itself (127.0.0.1 or ::1)","*Local hosts on the same LAN","*Remote hosts on other networks","Only the default gateway","Only the DNS server"],e:"Себе (loopback), локальным хостам напрямую, удалённым — через шлюз."},
{t:"l3",l:2,q:"How does an IPv6 host decide whether a destination is local or remote?",o:["*It uses the network prefix advertised by the local router","It uses its subnet mask","It sends an ARP request","It asks the DNS server"],e:"IPv4-хост сравнивает адреса по маске, IPv6-хост — по префиксу из RA."},
{t:"l3",l:2,q:"Which three features must a default gateway have?",o:["*An IP address in the same range as the LAN","*The ability to accept data from the LAN and forward it off the LAN","*The ability to route to other networks","A public IP address on every interface","A DHCP server enabled"],e:"Шлюзом может быть роутер или коммутатор Layer 3."},
{t:"l3",l:2,q:"Which three sections are shown by route print on Windows?",o:["*Interface list","*IPv4 routing table","*IPv6 routing table","ARP cache","DNS cache"],e:"Interface list показывает интерфейсы и их MAC-адреса."},
{t:"l3",l:2,q:"Which three types of routes appear in a router's routing table?",o:["*Directly connected","*Remote","*Default","Broadcast","Loopback only"],e:"Подключённые сети добавляются автоматически, если интерфейс активен и у него есть адрес."},
{t:"l3",l:2,q:"When are directly connected routes added to a routing table?",o:["*Automatically, when the interface is active and has an address","Only after a routing protocol is enabled","Only when the administrator types ip route","After the configuration is saved"],e:"Нужно, чтобы интерфейс был up и у него был адрес."},
{t:"l3",l:2,q:"Which three statements describe static routing?",o:["*It must be configured manually","*It must be adjusted manually when the topology changes","*It suits small networks without redundancy","It automatically finds new paths","It shares routes with neighbors"],e:"Статические маршруты часто используют вместе с динамическими, например для маршрута по умолчанию."},
{t:"l3",l:2,q:"Which three tasks does dynamic routing perform automatically?",o:["*Discover remote networks","*Choose the best path to a destination","*Find new best paths when the topology changes","Assign IP addresses to hosts","Translate private addresses"],e:"Также поддерживает информацию в актуальном состоянии и может раздавать статический маршрут по умолчанию."},
{t:"l3",l:2,q:"In show ip route, which code marks a directly connected network?",o:["*C","L","S","O"],e:"C — подключённая сеть, L — адрес самого интерфейса (/32)."},
{t:"l3",l:2,q:"In show ip route, which code marks the local interface IP address?",o:["*L","C","S","D"],e:"L-маршрут для IPv4 имеет маску /32, для IPv6 — /128."},
{t:"l3",l:2,q:"In show ip route, which code marks an EIGRP route?",o:["*D","E","O","R"],e:"O — OSPF, D — EIGRP."},
{t:"l3",l:2,q:"How is a static default route shown in show ip route?",o:["*S*","S","C*","O*"],e:"Звёздочка обозначает маршрут-кандидат по умолчанию."},
{t:"l3",l:3,q:"show ip route shows C 209.165.200.224/30 and L 209.165.200.225/32 on G0/0/1. What is the IP address of G0/0/1?",o:["*209.165.200.225","209.165.200.224","209.165.200.226","209.165.200.227"],e:"L-маршрут /32 — это адрес самого интерфейса. C — сеть, к которой он подключён."},
{t:"l3",l:3,q:"What does the line Gateway of last resort is not set in show ip route mean?",o:["*No default route is configured, so packets with no matching route are dropped","The router has no connected networks","The router has no interfaces up","The router uses OSPF"],e:"Без маршрута по умолчанию пакеты в неизвестные сети отбрасываются."},

/* Лекция 5: ARP */
{t:"arp",l:2,q:"Which two basic functions does ARP provide?",o:["*Resolving IPv4 addresses to MAC addresses","*Maintaining a table of IPv4-to-MAC mappings","Assigning IP addresses","Resolving names to IP addresses","Finding the best route"],e:"ARP находит MAC по IP и хранит найденные пары в таблице."},
{t:"arp",l:2,q:"Which protocol does IPv6 use to associate an IPv6 address with a MAC address?",o:["*ICMPv6 (Neighbor Discovery)","ARP","DHCPv6","DNS"],e:"Neighbor Discovery работает на сообщениях ICMPv6."},
{t:"arp",l:3,q:"A host must send a frame. Its ARP table has no entry for the needed IPv4 address. What happens next?",o:["*The host sends an ARP request","The host sends the frame to FF-FF-FF-FF-FF-FF with the data","The host drops the packet","The host asks the DNS server"],e:"Сначала хост ищет в таблице, при промахе шлёт ARP-запрос."},
{t:"arp",l:2,q:"What ARP timeout does a Cisco router interface show by default in show interfaces?",o:["*4 hours (04:00:00)","5 minutes","30 seconds","24 hours"],e:"ARP Timeout 04:00:00 в выводе show interfaces у роутера. Хосты обычно держат записи намного меньше."},

/* Лекция 5: настройка роутера */
{t:"ios",l:2,q:"Which command lets only SSH sessions use the vty lines?",o:["*transport input ssh","login local","ip ssh version 2","line vty 0 4 ssh"],e:"transport input {ssh | telnet} задаёт разрешённые протоколы удалённого доступа."},
{t:"ios",l:2,q:"How many vty lines are configured with line vty 0 4 on a router?",o:["*5","4","16","1"],e:"Линии 0, 1, 2, 3, 4."},
{t:"ios",l:2,q:"Why is the description command recommended on router interfaces?",o:["*It documents which network the interface connects to","It activates the interface","It assigns an IP address","It sets the interface speed"],e:"Описание помогает при поиске неисправностей."},
{t:"ios",l:2,q:"After no shutdown, which two console messages show that the interface is fully up?",o:["*%LINK-3-UPDOWN: Interface changed state to up","*%LINEPROTO-5-UPDOWN: Line protocol changed state to up","%SYS-5-CONFIG_I","%IP-4-DUPADDR","%SSH-5-ENABLED"],e:"LINK — физический уровень, LINEPROTO — канальный протокол."},
{t:"ios",l:2,q:"Which command displays all interfaces, their IPv6 addresses and status?",o:["*show ipv6 interface brief","show ipv6 route","show interfaces","show ip interface brief"],e:"В выводе видно link-local и глобальный адрес каждого интерфейса."},
{t:"ios",l:2,q:"Which command displays statistics for all interfaces but shows only IPv4 addressing information?",o:["*show interfaces","show ip interface brief","show ipv6 interface","show ip route"],e:"show interfaces — счётчики, MTU, дуплекс, скорость, ошибки."},
{t:"ios",l:2,q:"Which command displays the contents of the IPv6 routing table?",o:["*show ipv6 route","show ip route","show ipv6 interface brief","show ipv6 neighbors"],e:"Таблицы маршрутов хранятся в RAM."},
{t:"ios",l:3,q:"In show ipv6 interface brief, an interface shows FE80::201:C9FF:FE89:4501 and 2001:DB8:ACAD:10::1. What are these addresses?",o:["*The link-local address and the global unicast address","Two global unicast addresses","The MAC address and the IPv6 address","The default gateway and the interface address"],e:"FE80:: — link-local, 2001:DB8:... — глобальный адрес."},
{t:"ios",l:3,q:"In show ip interface brief, Vlan1 shows unassigned and administratively down/down on a router. What does this mean?",o:["*The interface has no IP address and has not been enabled with no shutdown","The cable is unplugged","The interface has a duplicate address","The routing protocol failed"],e:"administratively down — интерфейс выключен командой shutdown или ещё не включён."},
{t:"ios",l:3,q:"In show ipv6 route, which route appears automatically for the IPv6 multicast range?",o:["*L FF00::/8 via Null0","C FF00::/8","S ::/0","L FE80::/10"],e:"Это служебная локальная запись для всего диапазона multicast."},
{t:"ios",l:2,q:"In which configuration mode is ip default-gateway entered on a switch?",o:["*Global configuration mode","Interface configuration mode","Line configuration mode","Privileged EXEC mode"],e:"Switch(config)# ip default-gateway 192.168.10.1."},
{t:"ios",l:3,q:"PC1 sends a packet to PC3 on another network. Which IP address is in the packet, and where is the frame sent?",o:["*PC3's IP address; the frame goes to the default gateway's MAC","The gateway's IP address; the frame goes to PC3's MAC","PC3's IP address; the frame goes to PC3's MAC","The gateway's IP and MAC address"],e:"IP — конечного получателя, MAC — следующего шага (шлюза)."},
{t:"ios",l:3,q:"In show interfaces output, which line shows the duplex and speed?",o:["*Full Duplex, 100Mbps, link type is auto, media type is RJ45","MTU 1500 bytes, BW 100000 Kbit/sec","Encapsulation ARPA, loopback not set","5 minute input rate 0 bits/sec"],e:"Это первое место, куда смотреть при подозрении на duplex mismatch."},
{t:"ios",l:3,q:"In show ipv6 interface, the router has joined FF02::1. What is this group?",o:["*The all-nodes multicast group","The all-routers multicast group","A solicited-node group","The router's link-local address"],e:"FF02::1 — все узлы. FF02::1:FFxx:xxxx — solicited-node группы."}
);

/* Лекции 6–7: детали со слайдов */
BANK.push(
/* Лекция 6: IPv4 */
{t:"v4",l:1,q:"What is the prefix length notation for 255.255.255.0?",a:["24","/24"],ph:"например /24",e:"24 единицы в маске."},
{t:"v4",l:1,q:"What is the process of comparing an IPv4 address with the subnet mask bit by bit called?",o:["*ANDing","XORing","Subnetting","Hashing"],e:"1 AND 1 = 1, остальное 0. Результат — адрес сети."},
{t:"v4",l:1,q:"Which statement about the prefix length is true?",o:["*It is the number of bits set to 1 in the subnet mask","It is the number of host bits","It is the number of usable hosts","It is the first octet of the address"],e:"/24 — 24 единицы, 8 нулей."},
{t:"v4",l:1,q:"What value do all host bits have in a network address?",o:["*All 0s","All 1s","All 0s and a final 1","All 1s and a final 0"],e:"Сеть — все нули в части хоста, первый хост — нули и 1 в конце, последний хост — единицы и 0 в конце, broadcast — все единицы."},
{t:"v4",l:1,q:"What value do all host bits have in a broadcast address?",o:["*All 1s","All 0s","Alternating 1s and 0s","All 1s and a final 0"],e:"Например 192.168.10.255 для /24."},
{t:"v4",l:2,q:"In 192.168.10.0/24, what are the host bits of the last usable host address?",o:["*All 1s and a final 0 (11111110)","All 1s (11111111)","All 0s and a final 1 (00000001)","All 0s (00000000)"],e:"Последний хост — 192.168.10.254."},
{t:"v4",l:1,q:"What is the IPv4 multicast address range?",o:["*224.0.0.0 to 239.255.255.255","240.0.0.0 to 255.255.255.255","169.254.0.0 to 169.254.255.255","127.0.0.0 to 127.255.255.255"],e:"Класс D — multicast, класс E — экспериментальный."},
{t:"v4",l:2,q:"A PC at 172.16.4.1 sends a packet to 224.10.10.5. What type of transmission is this?",o:["*Multicast","Unicast","Broadcast","Anycast"],e:"224.10.10.5 лежит в диапазоне 224–239."},
{t:"v4",l:1,q:"Which RFC defines the private IPv4 address ranges?",o:["*RFC 1918","RFC 790","RFC 2460","RFC 4861"],e:"RFC 790 (1981) ввёл классы адресов."},
{t:"v4",l:2,q:"What is the full range of the 172.16.0.0/12 private block?",o:["*172.16.0.0 to 172.31.255.255","172.16.0.0 to 172.16.255.255","172.0.0.0 to 172.255.255.255","172.16.0.0 to 172.32.255.255"],e:"/12 охватывает 16 сетей класса B: 172.16–172.31."},
{t:"v4",l:2,q:"Where is NAT typically enabled?",o:["*On the edge router that connects to the internet","On every switch","On each host","On the DNS server"],e:"Граничный роутер переводит частные адреса в публичные."},
{t:"v4",l:2,q:"What is the usable host range of the loopback block?",o:["*127.0.0.1 to 127.255.255.254","127.0.0.0 to 127.0.0.255","127.0.0.1 only","127.0.0.1 to 127.0.0.254"],e:"Весь блок 127.0.0.0/8 — loopback, но обычно используют 127.0.0.1."},
{t:"v4",l:2,q:"Which addresses does Windows use to self-configure when no DHCP server is available?",o:["*169.254.0.1 to 169.254.255.254 (APIPA)","127.0.0.1 to 127.255.255.254","10.0.0.1 to 10.255.255.254","192.168.0.1 to 192.168.0.254"],e:"Link-local IPv4 / APIPA."},
{t:"v4",l:2,q:"Which range belongs to legacy Class C?",o:["*192.0.0.0/24 to 223.255.255.0/24","128.0.0.0/16 to 191.255.0.0/16","0.0.0.0/8 to 127.0.0.0/8","224.0.0.0 to 239.0.0.0"],e:"A: 0–127 /8, B: 128–191 /16, C: 192–223 /24, D: 224–239, E: 240–255."},
{t:"v4",l:2,q:"Which legacy class is reserved as experimental?",o:["*Class E (240.0.0.0 – 255.0.0.0)","Class D","Class C","Class A"],e:"D — multicast, E — экспериментальные."},
{t:"v4",l:2,q:"Why was classful addressing replaced by classless addressing?",o:["*Classful addressing wasted many IPv4 addresses","Classless addressing is required by IPv6","Classful addressing could not be routed","Classful addressing had no broadcast"],e:"Сеть класса A или B для маленькой организации тратила тысячи адресов."},
{t:"v4",l:2,q:"How many Regional Internet Registries does IANA allocate address blocks to?",o:["*Five","Three","Seven","Ten"],e:"IANA → 5 RIR → провайдеры → организации."},
{t:"v4",l:2,q:"Which two protocols are given in the course as examples that use broadcasts?",o:["*ARP, to locate other devices","*DHCP, when hosts send a Discover to find a server","DNS queries","HTTP requests","SSH sessions"],e:"Именно поэтому большой broadcast-домен становится проблемой."},
{t:"v4",l:2,q:"What is the only device that stops broadcasts?",o:["*A router","A switch","A hub","An access point"],e:"Каждый интерфейс роутера — отдельный broadcast-домен."},
{t:"v4",l:2,q:"172.16.0.0/16 is divided into two subnets of 200 users each. Which two subnets fit the course example?",o:["*172.16.0.0/24","*172.16.1.0/24","172.16.0.0/16","172.16.2.0/23","172.17.0.0/24"],e:"Каждая /24 даёт 254 хоста ≥ 200, и broadcast остаётся внутри своей подсети."},
{t:"v4",l:2,q:"Which three statements describe reasons for subnetting?",o:["*It reduces overall network traffic and improves performance","*It allows security policies to be applied between subnets","*It reduces the number of devices affected by abnormal broadcast traffic","It increases the number of public addresses","It removes the need for routers"],e:"Делят по месту, по группе или функции, по типу устройств."},
{t:"v4",l:2,q:"At which octet boundaries are networks most easily subnetted?",o:["*/8, /16 and /24","/4, /12 and /20","/10, /20 and /30","/25, /26 and /27"],e:"На границе октета шаг равен 1 в целом октете — это проще всего считать."},
{t:"v4",l:2,q:"How many usable hosts does a /16 network have?",a:["65534","65 534","65,534"],ph:"число",e:"2^16 − 2 = 65 534."},
{t:"v4",l:2,q:"How many usable hosts does a /8 network have?",o:["*16,777,214","65,534","16,777,216","254"],e:"2^24 − 2 = 16 777 214."},
{t:"v4",l:2,q:"10.0.0.0/8 is subnetted with a /24 mask. How many subnets are possible?",o:["*65,536","256","16,777,216","4,096"],e:"Заимствовано 16 бит: 2^16 = 65 536 подсетей по 254 хоста."},
{t:"v4",l:2,q:"10.0.0.0/8 is subnetted with a /16 mask. How many subnets are possible?",o:["*256","65,536","128","16"],e:"Заимствовано 8 бит: 2^8 = 256 подсетей по 65 534 хоста."},
{t:"v4",l:2,q:"What is the broadcast address of the subnet 10.1.0.0/16?",a:["10.1.255.255"],ph:"адрес",e:"Хосты 10.1.0.1 – 10.1.255.254, broadcast 10.1.255.255."},
{t:"v4",l:2,q:"How many subnets and hosts does a /29 give when a /24 is subnetted?",o:["*32 subnets with 6 hosts each","16 subnets with 14 hosts each","64 subnets with 2 hosts each","8 subnets with 30 hosts each"],e:"Заимствовано 5 бит (2^5 = 32), остаётся 3 бита хоста (2^3 − 2 = 6)."},
{t:"v4",l:2,q:"How many /30 subnets can be made from a /24?",a:["64"],ph:"число",e:"6 заимствованных бит: 2^6 = 64 подсети по 2 хоста."},
{t:"v4",l:2,q:"What happens to the number of hosts per subnet as the prefix length gets longer?",o:["*It decreases","It increases","It stays the same","It doubles"],e:"Больше бит сети — меньше бит хоста."},
{t:"v4",l:2,q:"Which two considerations matter when planning subnets?",o:["*The number of host addresses required in each network","*The number of individual subnets needed","The brand of the routers","The cable color","The number of DNS servers"],e:"Нужно уместить и подсети, и хосты в каждой."},
{t:"v4",l:2,q:"In the course example, 172.16.0.0/22 gives how many host addresses?",o:["*1,022","1,024","510","2,046"],e:"10 бит хоста: 2^10 − 2 = 1 022."},
{t:"v4",l:3,q:"A /27 is used for every link in the VLSM example. How many subnets and hosts does a /27 give from a /24?",o:["*8 subnets of 30 hosts","4 subnets of 62 hosts","16 subnets of 14 hosts","8 subnets of 32 hosts"],e:"Пример из лекции: 7 нужных подсетей помещаются в 8, но на каналах точка-точка тратятся адреса."},
{t:"v4",l:3,q:"In the VLSM example, the last /27 subnet is divided into /30 subnets. How many /30 subnets does that give?",a:["8"],ph:"число",e:"Из /27 в /30 заимствуется 3 бита: 2^3 = 8 подсетей по 2 хоста."},
{t:"v4",l:3,q:"Building D has 28 hosts, the largest LAN in the VLSM example. Which prefix fits it best?",o:["*/27","/28","/26","/30"],e:"/28 даёт только 14 хостов, /27 — 30, этого хватает."},
{t:"v4",l:2,q:"Which part of an enterprise network typically uses public IPv4 addresses?",o:["*The DMZ with internet-facing servers","The intranet","The guest Wi-Fi","The management VLAN"],e:"Интранет обычно на частных адресах, DMZ — на публичных."},
{t:"v4",l:2,q:"Which devices should have predictable static IP addresses?",o:["*Servers and peripherals such as printers","End user clients","Guest phones","Laptops of visitors"],e:"Клиенты чаще получают адреса по DHCP, чтобы снизить ошибки и нагрузку на поддержку."},
{t:"v4",l:2,q:"Why do most end user clients use DHCP rather than static addresses?",o:["*To reduce errors and the burden on network support staff","Because static addresses are not allowed","Because DHCP is faster than ARP","Because servers require it"],e:"Ручная настройка на сотнях клиентов приводит к ошибкам и конфликтам."},
{t:"v4",l:3,q:"An administrator plans addressing. Which approach does the course recommend?",o:["*Use a set pattern for how addresses are allocated to each device type, such as gateways and servers","Assign addresses randomly to save time","Use only public addresses everywhere","Give every device a DHCP address, including routers"],e:"Единый шаблон (например, шлюз всегда .1) упрощает управление и поиск неисправностей."},
{t:"v4",l:3,q:"Which tasks are part of a network requirement study for an IPv4 addressing scheme?",o:["*Determine how many subnets are needed and how many hosts each needs","*Determine DHCP address pools and VLAN pools","Choose the cable colors","Pick the routing protocol vendor","Set every host to a static address"],e:"Сначала изучают потребности сети, затем делят на подсети."},
{t:"v4",l:3,q:"A host has IP 172.16.4.100 with mask 255.255.255.0. What is the result of ANDing them?",a:["172.16.4.0"],ph:"адрес",e:"Последний октет маски 0, поэтому последний октет адреса обнуляется."},

/* Лекция 7: IPv6 */
{t:"v6",l:2,q:"Which three migration techniques did the IETF create for moving from IPv4 to IPv6?",o:["*Dual stack","*Tunneling","*Translation (NAT64)","VLSM","PAT"],e:"Это три категории техник сосуществования IPv4 и IPv6."},
{t:"v6",l:2,q:"Which migration technique encapsulates an IPv6 packet inside an IPv4 packet?",o:["*Tunneling","Dual stack","NAT64","SLAAC"],e:"IPv6-пакет едет по IPv4-сети как обычные данные."},
{t:"v6",l:2,q:"Which technique lets IPv6-only devices communicate with IPv4-only devices?",o:["*NAT64 translation","Dual stack","Tunneling","EUI-64"],e:"NAT64 переводит IPv6-пакет в IPv4 и обратно."},
{t:"v6",l:2,q:"Which technique is known as native IPv6, where the customer network has an IPv6 connection to its ISP?",o:["*Dual stack","Tunneling","NAT64","6to4 only"],e:"Устройства одновременно работают с IPv4 и IPv6."},
{t:"v6",l:1,q:"Are IPv6 addresses case-sensitive?",o:["*No, they can be written in lowercase or uppercase","Yes, they must be lowercase","Yes, they must be uppercase","Only the prefix is case-sensitive"],e:"2001:DB8::1 и 2001:db8::1 — один и тот же адрес."},
{t:"v6",l:2,q:"What is 09f0 after omitting leading zeros?",o:["*9f0","9f","09f","90"],e:"Убираются только ведущие нули. Хвостовые нули значимые."},
{t:"v6",l:2,q:"Why may trailing zeros in a hextet not be omitted?",o:["*The address would become ambiguous","They are needed for the checksum","IPv6 requires an even number of digits","Trailing zeros mark the prefix"],e:"Например, a00 нельзя сократить до a: это было бы 000a."},
{t:"v6",l:2,q:"What is the compressed form of 2001:0db8:0000:1111:0000:0000:0000:0200?",o:["*2001:db8:0:1111::200","2001:db8::1111::200","2001:db8:0:1111::2","2001:db8::1111:0:0:0:200"],e:"Пример из лекции 7: убираем ведущие нули, :: заменяет три нулевых хекстета."},
{t:"v6",l:2,q:"Which IPv6 address type is a unicast address assigned to multiple devices, where packets go to the nearest one?",o:["*Anycast","Multicast","Link-local","Broadcast"],e:"Anycast — один адрес у нескольких устройств, доставка ближайшему."},
{t:"v6",l:2,q:"What replaces broadcast in IPv6?",o:["*The all-nodes multicast address","Anycast addresses","The link-local address","The unspecified address ::"],e:"ff02::1 даёт по сути тот же эффект, что broadcast."},
{t:"v6",l:2,q:"What is the range of possible IPv6 prefix lengths?",o:["*0 to 128","0 to 32","1 to 64","8 to 128"],e:"Для LAN рекомендуется /64."},
{t:"v6",l:2,q:"How many unicast addresses does an IPv6 interface typically have?",o:["*Two: a GUA and an LLA","One, like IPv4","Three: GUA, LLA and ULA always","Only an LLA"],e:"В отличие от IPv4, у интерфейса обычно и глобальный, и link-local адрес."},
{t:"v6",l:2,q:"Which three statements describe IPv6 unique local addresses?",o:["*They are used for local addressing within a site or between a limited number of sites","*They can be used for devices that never need to access another network","*They are not globally routed or translated to a global IPv6 address","They start with fe80","They are required on every interface"],e:"ULA (fc00::/7) похожи на частные адреса RFC 1918, но NAT для них не используется."},
{t:"v6",l:2,q:"Which first three bits do currently assigned GUAs have?",o:["*001","000","111","010"],e:"001 = 2000::/3, поэтому GUA начинаются с 2 или 3."},
{t:"v6",l:2,q:"What fraction of the total IPv6 address space is the 2000::/3 range currently used for GUAs?",o:["*1/8","1/2","1/4","1/16"],e:"/3 — это 1/2^3 = 1/8 всего пространства."},
{t:"v6",l:2,q:"Which part of an IPv6 GUA is equivalent to the host portion of an IPv4 address?",o:["*Interface ID","Subnet ID","Global routing prefix","Prefix length"],e:"Interface ID определяет конкретное устройство."},
{t:"v6",l:3,q:"Which statement about packets with a link-local source or destination address is true?",o:["*They cannot be routed","They are always routed to the ISP","They are dropped by switches","They are translated by NAT64"],e:"LLA действует только в пределах одного канала."},
{t:"v6",l:2,q:"Which command configures a GUA on a router interface?",o:["*ipv6 address 2001:db8:acad:1::1/64","ip address 2001:db8:acad:1::1 /64","ipv6 address 2001:db8:acad:1::1 255.255.255.0","ipv6 enable 2001:db8:acad:1::1"],e:"Синтаксис: ipv6 address адрес/длина-префикса."},
{t:"v6",l:2,q:"Which command manually configures the link-local address fe80::1:1 on an interface?",o:["*ipv6 address fe80::1:1 link-local","ipv6 link-local fe80::1:1","ipv6 address fe80::1:1/64","ip address fe80::1:1 link-local"],e:"Ключевое слово link-local стоит после адреса."},
{t:"v6",l:2,q:"Why would an administrator configure a link-local address manually?",o:["*To make it recognizable and easier to remember","Because routers cannot create one automatically","To make it routable","To replace the GUA"],e:"Например fe80::1 на шлюзе проще запомнить, чем адрес EUI-64."},
{t:"v6",l:3,q:"Can the same link-local address be configured on several interfaces of one router?",o:["*Yes, as long as it is unique on each link","No, it must be unique on the whole router","No, it must be globally unique","Only on serial interfaces"],e:"LLA должен быть уникальным только в своём канале. Но обычно для удобства задают разные."},
{t:"v6",l:2,q:"When a Windows host is configured manually with IPv6, which gateway address is best practice?",o:["*The router's link-local address","The router's GUA","The DNS server address","ff02::2"],e:"Можно указать и GUA роутера, но рекомендуется LLA."},
{t:"v6",l:2,q:"Which three items can an ICMPv6 Router Advertisement include?",o:["*The network prefix and prefix length","*The default gateway address (the router's LLA)","*DNS server addresses and a domain name","The host's MAC address","A list of ARP entries"],e:"RA — подсказка хосту, как получить адрес. Окончательно решает ОС хоста."},
{t:"v6",l:3,q:"Which RA method says: I can give you your default gateway address, but ask a stateful DHCPv6 server for everything else?",o:["*Method 3: Stateful DHCPv6","Method 1: SLAAC","Method 2: SLAAC with stateless DHCPv6","Method 4: Static"],e:"В методе 3 адрес, DNS и прочее выдаёт сервер DHCPv6. Шлюз всё равно из RA."},
{t:"v6",l:3,q:"Which RA method says: I have everything you need, including the prefix, prefix length and default gateway?",o:["*Method 1: SLAAC","Method 2: SLAAC with stateless DHCPv6","Method 3: Stateful DHCPv6","Manual configuration"],e:"Хост сам собирает адрес из префикса."},
{t:"v6",l:2,q:"In which two RA methods must the client generate its own interface ID?",o:["*SLAAC","*SLAAC with stateless DHCPv6","Stateful DHCPv6","Manual configuration","DHCPv4"],e:"В stateful DHCPv6 адрес целиком выдаёт сервер."},
{t:"v6",l:2,q:"In EUI-64, what 16-bit value is inserted into the middle of the 48-bit MAC address?",o:["*fffe","ffff","0000","fe80"],e:"MAC делится пополам, в середину вставляется ff:fe."},
{t:"v6",l:2,q:"In EUI-64, which bit of the MAC address is reversed?",o:["*The 7th bit","The 1st bit","The 8th bit","The last bit"],e:"7-й бит первого байта меняется с 0 на 1."},
{t:"v6",l:3,q:"A Windows host shows IPv6 Address 2001:db8:acad:1:fc99:47ff:fe75:cee0. How was its interface ID created?",o:["*With EUI-64 (ff:fe in the middle shows it)","Randomly","By a stateful DHCPv6 server","By manual configuration"],e:"Признак EUI-64 — ff:fe в середине Interface ID. Случайный ID такого шаблона не имеет."},
{t:"v6",l:3,q:"A Windows host has the same interface ID in its GUA and its link-local address. Why?",o:["*Windows typically uses the same method for both the SLAAC GUA and the dynamic LLA","The LLA was copied from the router","The GUA was assigned by DHCPv6","It is a coincidence"],e:"Пример из лекции: обе половины одинаковы — fc99:47ff:fe75:cee0 или 50a5:8a35:a5bb:66e1."},
{t:"v6",l:2,q:"How do Cisco routers generate the interface ID of a link-local address by default?",o:["*With EUI-64","Randomly","From a DHCPv6 server","As ::1"],e:"Cisco автоматически создаёт LLA при назначении GUA, используя EUI-64."},
{t:"v6",l:3,q:"A router interface has MAC 7079.b392.3640. Which link-local address will Cisco IOS create with EUI-64?",o:["*FE80::7279:B3FF:FE92:3640","FE80::7079:B3FF:FE92:3640","FE80::7279:B392:FFFE:3640","FE80::7079:B392:3640"],e:"Пример из лекции: 70 → 72 (переворот 7-го бита) и FF:FE в середину."},
{t:"v6",l:2,q:"How many host addresses does a 64-bit interface ID support per subnet?",o:["*About 18 quintillion","About 65 thousand","About 4 billion","About 16 million"],e:"2^64 ≈ 18 квинтиллионов."},
{t:"v6",l:2,q:"Router R1 has interfaces 2001:db8:acad:1::1/64, 2001:db8:acad:2::1/64 and 2001:db8:acad:3::1/64. What differs between the three subnets?",o:["*Only the subnet ID hextet","The global routing prefix","The interface ID","The prefix length"],e:"Глобальный префикс одинаков, меняется только хекстет Subnet ID."},
{t:"v6",l:3,q:"Is address conservation a concern when subnetting IPv6?",o:["*No, there are more than enough subnets and hosts per subnet","Yes, VLSM is required as in IPv4","Yes, /64 subnets waste addresses","Only for link-local addresses"],e:"Поэтому для всех LAN просто используют /64."},

/* Лекция 7: ICMP */
{t:"icmp",l:2,q:"Which three ICMP message types are common to ICMPv4 and ICMPv6?",o:["*Host reachability (Echo)","*Destination or Service Unreachable","*Time Exceeded","Router Advertisement","Neighbor Solicitation"],e:"RS, RA, NS, NA — новые сообщения только в ICMPv6."},
{t:"icmp",l:2,q:"Why are ICMPv4 messages often not allowed within a network?",o:["*For security reasons; they are not required","They slow down routing","They replace TCP","They cannot cross switches"],e:"Поэтому отсутствие ответа на ping не всегда означает, что хост выключен."},
{t:"icmp",l:2,q:"Which ICMPv4 Destination Unreachable code means port unreachable?",o:["*3","0","1","2"],e:"0 — сеть, 1 — хост, 2 — протокол, 3 — порт."},
{t:"icmp",l:2,q:"Which ICMPv4 Destination Unreachable code means host unreachable?",o:["*1","0","2","3"],e:"0 — net unreachable, 1 — host unreachable."},
{t:"icmp",l:2,q:"Which ICMPv6 Destination Unreachable code means communication is administratively prohibited, for example by a firewall?",o:["*1","0","3","4"],e:"ICMPv6: 0 — нет маршрута, 1 — запрещено администратором, 2 — вне области адреса, 3 — адрес недоступен, 4 — порт недоступен."},
{t:"icmp",l:2,q:"Which ICMPv6 Destination Unreachable code means port unreachable?",o:["*4","3","1","0"],e:"В ICMPv4 это код 3, в ICMPv6 — код 4."},
{t:"icmp",l:2,q:"Which IPv6 header field does ICMPv6 use to decide that a packet has expired?",o:["*Hop Limit","TTL","Flow Label","Traffic Class"],e:"В IPv6 нет TTL, его заменяет Hop Limit."},
{t:"icmp",l:2,q:"Which two ICMPv6 messages are used between an IPv6 router and an IPv6 device, including dynamic address allocation?",o:["*Router Solicitation","*Router Advertisement","Neighbor Solicitation","Neighbor Advertisement","Echo Reply"],e:"NS и NA — между устройствами (DAD и поиск MAC)."},
{t:"icmp",l:2,q:"How often do IPv6-enabled routers send RA messages?",o:["*Every 200 seconds","Every 30 seconds","Every 5 minutes","Only when asked"],e:"А также сразу в ответ на RS."},
{t:"icmp",l:3,q:"During DAD, how does a device check that its new address is unique?",o:["*It sends an NS with its own address as the target; if another device has it, that device replies with an NA","It sends an RS and waits for an RA","It pings ff02::2","It asks the DHCPv6 server"],e:"Нет ответа NA — адрес свободен. DAD не обязателен, но рекомендован RFC 4861."},
{t:"icmp",l:2,q:"What does the ping summary report?",o:["*The success rate and average round-trip time","The list of routers on the path","The MAC address of the destination","The open ports"],e:"Список роутеров даёт traceroute."},
{t:"icmp",l:3,q:"Why does the first ping often time out?",o:["*Address resolution (ARP or ND) must be done before the Echo Request is sent","The router is booting","The TTL is too low","The DNS lookup failed"],e:"Пока выясняется MAC получателя, первый Echo Request не уходит вовремя."},
{t:"icmp",l:3,q:"A ping to the default gateway fails. What does the course suggest trying next?",o:["*Ping another host on the local network that is known to be operational","Ping the loopback of the router","Reboot the router","Ping a remote server"],e:"Так можно понять, не работает шлюз или вся локальная сеть."},
{t:"icmp",l:2,q:"What does an asterisk (*) mean in traceroute output?",o:["*A lost or unanswered packet","The destination was reached","A router with high delay","An IPv6 hop"],e:"Роутер мог не ответить из-за сбоя или потому, что настроен не отвечать."},
{t:"icmp",l:2,q:"When does traceroute stop increasing the TTL?",o:["*When the destination is reached or a predefined maximum is hit","After exactly 3 hops","When the first router replies","When a packet is lost"],e:"Обычно максимум 30 хопов."},
{t:"icmp",l:3,q:"What value does the TTL field have in the first message sent by traceroute?",a:["1"],ph:"число",e:"TTL = 1 истекает на первом роутере, он присылает Time Exceeded."},
{t:"icmp",l:3,q:"Which IPv6 header field does traceroute use, in place of TTL?",o:["*Hop Limit","Flow Label","Next Header","Payload Length"],e:"Принцип тот же: Hop Limit 1, 2, 3…"}
);

/* Лекции 8–9 и модули 16–17: детали */

/* Лекция 8: транспорт — заголовки */
{t:"tr",l:2,q:"How long is the TCP Source Port field?",o:["*16 bits","32 bits","8 bits","4 bits"],e:"Порты в TCP и UDP — 16 бит, поэтому максимум 65 535."},
{t:"tr",l:2,q:"How long are the TCP Sequence Number and Acknowledgment Number fields?",o:["*32 bits each","16 bits each","8 bits each","64 bits each"],e:"Порты, окно, контрольная сумма и urgent — по 16 бит. SEQ и ACK — по 32 бита."},
{t:"tr",l:2,q:"Which TCP header field, also known as data offset, gives the length of the TCP segment header?",o:["*Header Length (4 bits)","Window size","Reserved","Urgent"],e:"Header Length — 4 бита, указывает длину заголовка TCP."},
{t:"tr",l:2,q:"How long is the TCP Window size field?",o:["*16 bits","32 bits","6 bits","4 bits"],e:"Window — 16 бит, сколько байт можно принять за раз."},

/* ---------- Генераторы задач ---------- */
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const toIp=n=>[n>>>24,(n>>>16)&255,(n>>>8)&255,n&255].join(".");
const maskOf=p=>p===0?0:(0xFFFFFFFF<<(32-p))>>>0;
const normIp=s=>s.trim().replace(/\s+/g,"");

function genSubnet(){
  const p=rnd(18,30);
  const base=pick([[10,rnd(0,255)],[172,rnd(16,31)],[192,168]]);
  const ip=((base[0]<<24)|(base[1]<<16)|(rnd(0,255)<<8)|rnd(1,254))>>>0;
  const m=maskOf(p), net=(ip&m)>>>0, bc=(net|(~m>>>0))>>>0, h=32-p, hosts=Math.pow(2,h)-2;
  const oi=Math.floor(p/8), mOct=(m>>>(24-8*oi))&255, block=256-mOct;
  const ipOct=(ip>>>(24-8*oi))&255, start=Math.floor(ipOct/block)*block;
  const ord=["1-й","2-й","3-й","4-й"][oi];
  const base_e=`Маска /${p} = ${toIp(m)}. Интересный ${ord} октет, шаг блока 256 − ${mOct} = ${block}. Значение ${ipOct} лежит в блоке ${start}–${start+block-1}, поэтому сеть ${toIp(net)}, broadcast ${toIp(bc)}, хосты ${toIp(net+1)} – ${toIp(bc-1)}, всего 2^${h} − 2 = ${hosts}.`;
  const kinds=[
    ["net","What is the network address of",toIp(net)],
    ["bc","What is the broadcast address of",toIp(bc)],
